[project]
name = "claude-dj"
version = "0.1.0"
description = "A local Claude Code DJ companion for Spotify."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "miniaudio>=1.61.0",
    "muq @ git+https://github.com/tencent-ailab/MuQ.git@28847ea50cd31ac4b8b6a7dacc051ad7d1c7606a",
    "sqlite-vec>=0.1.9",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
]

[project.scripts]
claude-dj = "claude_dj.cli:main"
claude-dj-install = "claude_dj.installer:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
