[project]
name = "claude-dj"
version = "0.1.0"
description = "A local OpenCode DJ companion for Spotify."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "librosa>=0.11.0",
  "muq @ git+https://github.com/tencent-ailab/MuQ.git",
  "questionary>=2.0.0",
  "soundfile>=0.13.1",
  "sqlite-vec>=0.1.9",
  "torch>=2.8.0",
  "uvicorn>=0.32.0",
]

[project.scripts]
dj = "claude_dj.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["claude_dj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
