[project]
name = "agent-dj"
version = "0.2.0"
description = "Spotify now-playing statusline for Claude Code, OpenCode, and Pi."

readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "beaupy>=3.10.0",
]

[project.scripts]
dj = "backend.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"src/backend/pi/extension.ts" = "backend/pi/extension.ts"
"src/backend/opencode/plugin" = "backend/opencode/plugin"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
